<!DOCTYPE html>
<html class="no-js" lang="en">
<head>
    <meta charset="utf-8">
    <title>Data Viewer</title>
    <link rel="stylesheet" href="https://clever-energy-scenario.eu/wp-content/themes/twentytwenty/style.css">
    <link rel="stylesheet" href="https://clever-energy-scenario.eu/wp-content/themes/clever/style.css">
    <script src="https://cdn.plot.ly/plotly-3.4.0.min.js"></script>
    <script id="nav-manifest" type="application/json">{{NAV_MANIFEST}}</script>
    <style>
        /* SEPIA style changes */
        #navsticky .menu-item { display: inline-block !important }
        #menu-item-59 img { display: inline-block }
        .site-main { padding:0 5%; }
        #navsticky li { top: -15px; }
        #navsticky #menu-dropdown { top: 10px; }
        #navsticky .menu-item-70 A { background:none; }
        #navsticky .menu-item-70 { margin-left:0; }
        #navsticky {
          background-color: #d2e9e0; /* light teal */
        }
        #navsticky #menu-item-70 > a {
            color: black;
            text-decoration: none;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            padding-left: 0; 
            margin-left: -5px;
        }
        #navsticky #return-arrow{
            font-size: 30px;
            padding-right: 3px;
            color: black;
        }
        .toc { 
            list-style: none; 
            padding: 0; 
            margin: 0;
            display: inline-block;
        }
        .toc li { 
            padding: 4px 8px;
            cursor: pointer; 
            margin: 1px 0;
            text-decoration: underline;
            font-size: 25px;
        }
        ol, ul {
            margin: 0;
            padding: 0;
        }
        .toc li:hover { 
            text-decoration: underline;
            background: none;
        }
        .toc li.disabled {
            opacity: 0.35;
            cursor: not-allowed;
            text-decoration: none;
        }
        .encart {
            margin-bottom: 50px;
        }
        #scenario-switch {
            margin-top: 10px;
            margin-bottom: 20px; 
            font-weight: bold;
            text-align: left;
            display: none;
            font-size: 30px;
            color: black;
        }
        #scenario-switch a {
            text-decoration: underline;
            color: blue;
            font-size: 30px;
        }
        #scenario-switch a:hover {
            text-decoration: underline;
        }
        .encart {
           background: none !important;
        }
        .secondary-toc {
           margin-left: 30px;
        }
        .secondary-toc li {
           font-size: 18px !important;
           padding: 1px 8px;
           cursor: pointer;
           text-decoration: underline;
           list-style: none !important;
           margin: 0;
        }
        .secondary-toc li:hover {
          text-decoration: underline;
          background: none;
        }
        .main-title {
          color: #008080;
        }
        #nav-warning {
            color: #8a1f1f;
            font-size: 14px;
            margin-top: 6px;
            display: none;
        }
    </style>
    <script>
    const NAV = JSON.parse(document.getElementById("nav-manifest").textContent);
    const CATEGORIES = NAV.categories || [
        "demands", "emissions", "costs", "capacities", "fec",
        "sankeys", "maps", "dispatch_plots"
    ];

    function getScenarioFromPath() {
        const parts = window.location.pathname.split("/").filter(Boolean);
        const idx = parts.lastIndexOf("htmls");
        if (idx > 0) {
            return parts[idx - 1];
        }
        return null;
    }

    function parsePageFromFilename(file) {
        const scenarios = [...(NAV.scenarios || [])].sort((a, b) => b.length - a.length);
        for (const scenario of scenarios) {
            const suffix = `_${scenario}.html`;
            if (!file.endsWith(suffix)) {
                continue;
            }
            const prefix = file.slice(0, -suffix.length);
            const splitIdx = prefix.indexOf("_");
            if (splitIdx > 0) {
                return {
                    country: prefix.slice(0, splitIdx),
                    category: prefix.slice(splitIdx + 1),
                    scenario,
                };
            }
        }
        return null;
    }

    function getCurrentPageInfo() {
        const file = window.location.pathname.split("/").pop().split("?")[0];
        const fromFilename = parsePageFromFilename(file);
        if (fromFilename) {
            return fromFilename;
        }
        const scenarioFromPath = getScenarioFromPath();
        const params = new URLSearchParams(window.location.search);
        return {
            country: params.get("c") || localStorage.getItem("selectedCountry") || "EU",
            category: "demands",
            scenario: scenarioFromPath
                || params.get("s")
                || (NAV.scenarios && NAV.scenarios[0])
                || "baseline",
        };
    }

    function pagesFor(scenario, country) {
        return (((NAV.pages || {})[scenario] || {})[country]) || [];
    }

    function allCountries() {
        const countries = new Set();
        for (const scenario of Object.keys(NAV.pages || {})) {
            for (const country of Object.keys(NAV.pages[scenario] || {})) {
                if ((NAV.pages[scenario][country] || []).length > 0) {
                    countries.add(country);
                }
            }
        }
        return [...countries].sort((a, b) => {
            if (a === "EU") return 1;
            if (b === "EU") return -1;
            return a.localeCompare(b);
        });
    }

    function resolveNavTarget(country, scenario, category) {
        const tryCategory = (c, s, cat) => {
            const pages = pagesFor(s, c);
            if (pages.includes(cat)) {
                return { country: c, scenario: s, category: cat };
            }
            if (pages.length > 0) {
                return { country: c, scenario: s, category: pages[0] };
            }
            return null;
        };

        let target = tryCategory(country, scenario, category);
        if (target) return target;

        for (const cat of CATEGORIES) {
            target = tryCategory(country, scenario, cat);
            if (target) return target;
        }

        for (const scen of (NAV.scenarios || [])) {
            target = tryCategory(country, scen, category);
            if (target) return target;
        }

        for (const scen of Object.keys(NAV.pages || {})) {
            for (const c of Object.keys(NAV.pages[scen] || {})) {
                const pages = NAV.pages[scen][c] || [];
                if (pages.length > 0) {
                    return { country: c, scenario: scen, category: pages[0] };
                }
            }
        }
        return null;
    }

    function buildHref(country, category, scenario) {
        const file = `${country}_${category}_${scenario}.html`;
        const query = `?c=${encodeURIComponent(country)}&s=${encodeURIComponent(scenario)}`;
        const currentScenario = getScenarioFromPath() || getCurrentPageInfo().scenario;
        if (scenario === currentScenario) {
            return file + query;
        }
        return `../../${scenario}/htmls/${file}${query}`;
    }

    function formatTitle(cat) {
        const titleMap = {
            "demands": "Demands",
            "emissions": "Emissions",
            "costs": "Costs",
            "capacities": "Capacities",
            "fec": "Energy Consumption",
            "sankeys": "Sankeys",
            "maps": "Maps",
            "dispatch_plots": "Dispatch",
        };
        return titleMap[cat] || cat;
    }

    function populateDropdowns() {
        const info = getCurrentPageInfo();
        const countrySelect = document.getElementById("country-select");
        const scenarioSelect = document.getElementById("scenario-select");
        countrySelect.innerHTML = "";
        scenarioSelect.innerHTML = "";

        for (const code of allCountries()) {
            const opt = document.createElement("option");
            opt.value = code;
            opt.textContent = (NAV.countryLabels || {})[code] || code;
            countrySelect.appendChild(opt);
        }

        for (const scenario of (NAV.scenarios || [])) {
            const opt = document.createElement("option");
            opt.value = scenario;
            opt.textContent = (NAV.scenarioLabels || {})[scenario] || scenario;
            scenarioSelect.appendChild(opt);
        }

        if ([...countrySelect.options].some(o => o.value === info.country)) {
            countrySelect.value = info.country;
        } else if (countrySelect.options.length > 0) {
            countrySelect.value = countrySelect.options[0].value;
        }

        if ([...scenarioSelect.options].some(o => o.value === info.scenario)) {
            scenarioSelect.value = info.scenario;
        } else if (scenarioSelect.options.length > 0) {
            scenarioSelect.value = scenarioSelect.options[0].value;
        }
    }

    function updateSelection() {
        const country = document.getElementById("country-select").value;
        const scenario = document.getElementById("scenario-select").value;
        const current = getCurrentPageInfo();
        const target = resolveNavTarget(country, scenario, current.category);
        const warning = document.getElementById("nav-warning");

        if (!target) {
            warning.style.display = "block";
            warning.textContent = `No dashboard page found for ${country} / ${scenario}.`;
            return;
        }
        warning.style.display = "none";
        localStorage.setItem("selectedCountry", target.country);
        localStorage.setItem("selectedScenario", target.scenario);
        window.location.href = buildHref(target.country, target.category, target.scenario);
    }

    function updateTableOfContents() {
        const info = getCurrentPageInfo();
        const tocList = document.getElementById("toc-list");
        const currentPath = window.location.pathname.split("/").pop().split("?")[0];
        const available = pagesFor(info.scenario, info.country);

        tocList.innerHTML = "";

        CATEGORIES.forEach(cat => {
            const listItem = document.createElement("li");
            listItem.textContent = formatTitle(cat);

            if (!available.includes(cat)) {
                listItem.classList.add("disabled");
                listItem.title = "Not available for this country/scenario";
                tocList.appendChild(listItem);
                return;
            }

            listItem.onclick = (e) => {
                e.preventDefault();
                window.location.href = buildHref(info.country, cat, info.scenario);
            };

            if (currentPath.includes(`_${cat}_`)) {
                listItem.classList.add("active");
                const secondaryContainer = document.createElement("div");
                secondaryContainer.classList.add("secondary-toc");
                secondaryContainer.innerHTML = "{{TABLE_OF_CONTENTS}}";
                tocList.appendChild(listItem);
                tocList.appendChild(secondaryContainer);
            } else {
                tocList.appendChild(listItem);
            }
        });
    }

    window.addEventListener("DOMContentLoaded", () => {
        populateDropdowns();
        const info = getCurrentPageInfo();
        localStorage.setItem("selectedCountry", info.country);
        localStorage.setItem("selectedScenario", info.scenario);
        updateTableOfContents();
    });
    </script>
</head>
<body>

    <div id="navsticky">
        <div class="nav-group">
            <span class="nav-label">Select Country:</span>
            <select id="country-select" onchange="updateSelection()"></select>
        </div>

        <div class="nav-group">
            <span class="nav-label">Select Scenario:</span>
            <select id="scenario-select" onchange="updateSelection()"></select>
        </div>
        <div id="nav-warning"></div>
    </div>

    <main id="main" class="site-main main_large">
        <div class="encart">
            <h2>Navigation</h2>
            <ul id="toc-list" class="toc"></ul>
        </div>

        <hr>

        <div id="content">
            {{MAIN}}
        </div>
    </main>

</body>
</html>
