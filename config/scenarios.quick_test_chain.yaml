# Scenario overrides for Snakefile_quick_test_chain.
# Shared settings (countries, clusters, sector_opts, ...) live in
# config/config.quick_test_chain.yaml. Each entry must set run.name so
# scenario-specific logic in the Python scripts resolves correctly.

baseline:
  run:
    name: baseline
  solving:
    constraints:
      co2_budget_nationl: true
      co2_price_national: false
      additionality: false
      activate_vre_share_criterion: false
      activate_carbon_intensity_criterion: false
      activate_direct_vre_connected_electrolysers: false
      temporal_correlation: false
      temporal_correlation_monthly: false
      endogenous_H2_demand_floor: false
      non_rfnbo_h2_cap_2025: false

baseline_without_H2:
  run:
    name: baseline_without_H2
  solving:
    constraints:
      co2_budget_nationl: false
      co2_price_national: true
      additionality: false
      activate_vre_share_criterion: false
      activate_carbon_intensity_criterion: false
      activate_direct_vre_connected_electrolysers: false
      temporal_correlation: false
      temporal_correlation_monthly: false
      endogenous_H2_demand_floor: false
      non_rfnbo_h2_cap_2025: false

RFNBO_CR:
  run:
    name: RFNBO_CR
  solving:
    constraints:
      co2_budget_nationl: false
      co2_price_national: true
      additionality: true
      activate_vre_share_criterion: false
      activate_carbon_intensity_criterion: false
      activate_direct_vre_connected_electrolysers: false
      temporal_correlation: true
      temporal_correlation_monthly: true
      endogenous_H2_demand_floor: true
      non_rfnbo_h2_cap_2025: true
